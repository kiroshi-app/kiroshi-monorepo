name: Bug report
description: Something in Kiroshi behaves incorrectly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not use this form for a security
        vulnerability** — follow [SECURITY.md](https://github.com/kiroshi-app/kiroshi-monorepo/blob/main/.github/SECURITY.md)
        and report it privately instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen
      options:
        - Desktop app (apps/app)
        - UI components or Storybook (packages/ui)
        - Tauri host / Rust side
        - Build, install, or tooling
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kiroshi version or commit
      placeholder: v0.1.0, or the commit SHA you built from
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 (Apple silicon), Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`. Leave empty if the bug does not involve running an agent.
      placeholder: 2.0.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Anything that shows the failure. Console output is rendered as code, so no backticks needed.
        Redact file paths, project names, and anything else you would rather not publish.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
