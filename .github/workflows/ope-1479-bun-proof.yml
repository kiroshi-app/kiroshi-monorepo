name: OPE-1479 bun proof

on:
  push:
    branches:
      - feature/ope-1479-every-job-of-the-release-and-ci-workflows-runs-the-same-bun

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    env:
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the lockfile is untouched
        run: git diff --exit-code bun.lock

      - name: Build sidecar
        run: bun run --filter sidecar build

      - name: Build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/app
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
