name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_BUILD_JOBS: default
  RUSTC_WRAPPER: ""

jobs:
  ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - name: Wait for the CI push run of the tagged commit to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$SECONDS
          while :; do
            elapsed=$((SECONDS - started))
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,url,conclusion --jq '.[] | [.status, .url, .conclusion] | @tsv')
            if [ -n "$run" ]; then
              IFS=$'\t' read -r status url conclusion <<< "$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "CI passed on $GITHUB_SHA: $url"
                  exit 0
                fi
                echo "::error::CI on $GITHUB_SHA concluded $conclusion: $url"
                exit 1
              fi
              echo "CI on $GITHUB_SHA is $status: $url"
            elif [ "$elapsed" -ge 600 ]; then
              echo "::error::No CI push run found for $GITHUB_SHA 10 minutes after ci-green started"
              exit 1
            fi
            if [ "$elapsed" -ge 5400 ]; then
              echo "::error::CI on $GITHUB_SHA did not complete within 90 minutes"
              exit 1
            fi
            sleep 30
          done

  release:
    needs: ci-green
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release notes from tag
        id: notes
        shell: bash
        run: |
          body="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            body="See the assets to download and install this version."
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar
        run: bun run --filter sidecar build

      - name: Build and upload
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        continue-on-error: true
        with:
          projectPath: apps/app
          tagName: ${{ github.ref_name }}
          releaseName: "Kiroshi ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build and upload (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/app
          tagName: ${{ github.ref_name }}
          releaseName: "Kiroshi ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
