name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_BUILD_JOBS: default
  RUSTC_WRAPPER: ""

jobs:
  ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - name: Wait for the CI push run of the tagged commit to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$SECONDS
          while :; do
            elapsed=$((SECONDS - started))
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --limit 1 \
              --json status,url,conclusion --jq '.[] | [.status, .url, .conclusion] | @tsv')
            if [ -n "$run" ]; then
              IFS=$'\t' read -r status url conclusion <<< "$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "CI passed on $GITHUB_SHA: $url"
                  exit 0
                fi
                echo "::error::CI on $GITHUB_SHA concluded $conclusion: $url"
                exit 1
              fi
              echo "CI on $GITHUB_SHA is $status: $url"
            elif [ "$elapsed" -ge 600 ]; then
              echo "::error::No CI push run found for $GITHUB_SHA 10 minutes after ci-green started"
              exit 1
            fi
            if [ "$elapsed" -ge 5400 ]; then
              echo "::error::CI on $GITHUB_SHA did not complete within 90 minutes"
              exit 1
            fi
            sleep 30
          done

  draft:
    needs: ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.notes.outputs.body }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the channel and the notes range of the tag
        id: channel
        shell: bash
        run: |
          stable='^v[0-9]+[.][0-9]+[.][0-9]+$'
          beta='^v[0-9]+[.][0-9]+[.][0-9]+-beta[.][0-9]+$'
          if [[ "$GITHUB_REF_NAME" =~ $stable ]]; then
            prerelease=false
            previous_pattern=$stable
          elif [[ "$GITHUB_REF_NAME" =~ $beta ]]; then
            prerelease=true
            previous_pattern="$stable|$beta"
          else
            echo "::error::Tag $GITHUB_REF_NAME is neither a stable vX.Y.Z nor a beta vX.Y.Z-beta.N tag, nothing built"
            exit 1
          fi
          previous=$(git tag --list 'v*' --sort=-creatordate \
            | awk -v tag="$GITHUB_REF_NAME" -v pattern="$previous_pattern" \
              'seen && !found && $0 ~ pattern { print; found = 1 } $0 == tag { seen = 1 }')
          if [ -z "$previous" ]; then
            echo "::error::No v* tag created before $GITHUB_REF_NAME to start its release notes from"
            exit 1
          fi
          echo "Release notes of $GITHUB_REF_NAME cover $previous..$GITHUB_REF_NAME"
          {
            echo "prerelease=$prerelease"
            echo "range=$previous..$GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"

      # The pipeline attaches no visual to a release.
      # A whats-new.png asset is added by hand to the release when one exists.
      - name: Generate the release notes from the commits of the range
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ steps.channel.outputs.range }}

      - name: Read the release notes
        id: notes
        shell: bash
        env:
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          body="$CHANGELOG"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            body="See the assets to download and install this version."
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or reuse the draft release of the tag
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -c --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | {id, draft, html_url}')
          published=$(jq -r 'select(.draft | not) | .html_url' <<< "$releases")
          if [ -n "$published" ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published, nothing uploaded: $published"
            exit 1
          fi
          id=$(jq -r 'select(.draft) | .id' <<< "$releases")
          if [ "$(grep -c . <<< "$id")" -gt 1 ]; then
            echo "::error::Release $GITHUB_REF_NAME has several drafts ($(tr '\n' ' ' <<< "$id")), keep one and re-run"
            exit 1
          fi
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Kiroshi $GITHUB_REF_NAME" \
              -f body="$RELEASE_NOTES" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq .id)
            echo "Created draft release $id for $GITHUB_REF_NAME"
          else
            echo "Reusing draft release $id for $GITHUB_REF_NAME"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar
        run: bun run --filter sidecar build

      - name: Build and upload
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        continue-on-error: true
        with:
          projectPath: apps/app
          releaseId: ${{ needs.draft.outputs.release-id }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ needs.draft.outputs.prerelease }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build and upload (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/app
          releaseId: ${{ needs.draft.outputs.release-id }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ needs.draft.outputs.prerelease }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [draft, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
      UPDATER_PLATFORMS: darwin-aarch64 darwin-aarch64-app darwin-x86_64 darwin-x86_64-app linux-x86_64 linux-x86_64-deb windows-x86_64 windows-x86_64-nsis
    steps:
      - name: Check the updater platforms of the draft latest.json
        shell: bash
        run: |
          asset=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | select(.name == "latest.json") | .url')
          if [ -z "$asset" ]; then
            echo "::error::Draft release of $GITHUB_REF_NAME has no latest.json, left as a draft"
            exit 1
          fi
          actual=$(gh api -H "Accept: application/octet-stream" "$asset" | jq -r '.platforms | keys[]' | sort)
          expected=$(tr ' ' '\n' <<< "$UPDATER_PLATFORMS" | sort)
          missing=$(comm -23 <(echo "$expected") <(echo "$actual") | tr '\n' ' ')
          extra=$(comm -13 <(echo "$expected") <(echo "$actual") | tr '\n' ' ')
          if [ -n "$missing$extra" ]; then
            echo "::error::latest.json of $GITHUB_REF_NAME left as a draft, missing platforms: [ $missing], extra platforms: [ $extra]"
            exit 1
          fi
          echo "latest.json of $GITHUB_REF_NAME lists every updater platform"

      - name: Publish the draft release
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq '"Published \(.tag_name): \(.html_url)"'

      - name: Mirror latest.json on the beta release
        if: needs.draft.outputs.prerelease == 'true'
        shell: bash
        run: |
          asset=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | select(.name == "latest.json") | .url')
          gh api -H "Accept: application/octet-stream" "$asset" > "$RUNNER_TEMP/latest.json"
          beta=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "beta" and (.draft | not)) | .id')
          if [ -z "$beta" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name=beta \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Kiroshi beta" \
              -f body="Updater feed of the beta channel: its latest.json points at the newest vX.Y.Z-beta.N pre-release." \
              -F draft=false \
              -F prerelease=true \
              -f make_latest=false \
              --jq '"Created the beta release: \(.html_url)"'
          fi
          gh release upload beta "$RUNNER_TEMP/latest.json" --clobber --repo "$GITHUB_REPOSITORY"
          echo "latest.json of $GITHUB_REF_NAME mirrored on the beta release"
