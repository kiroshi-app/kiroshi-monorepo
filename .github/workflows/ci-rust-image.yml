name: CI rust image

on:
  push:
    branches: ["**"]
    paths:
      - .github/ci-rust/Dockerfile
      - .github/workflows/ci-rust-image.yml
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ghcr.io/kiroshi-app/ci-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the CI rust image with the Dockerfile digest
        id: image
        run: echo "tag=$(sha256sum .github/ci-rust/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub container registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build the image
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: docker build --platform linux/amd64 --tag "$REPOSITORY:$TAG" .github/ci-rust

      - name: Push the image
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: docker push "$REPOSITORY:$TAG"
