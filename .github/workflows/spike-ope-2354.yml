name: Spike OPE-2354

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: spike-ope-2354-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probes:
    if: github.head_ref == 'feature/ope-2354-what-a-hostile-page-learns-from-the-empty'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            launcher: ""
          - os: windows-latest
            launcher: ""
          - os: ubuntu-latest
            launcher: xvfb-run -a
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: spikes/ope-2298-html-frame
    env:
      RUSTC_WRAPPER: ""
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Linux webview and the virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xvfb

      - name: Read the Rust version pinned in rust-toolchain.toml
        id: rust
        working-directory: .
        run: |
          version=$(sed -n 's/^channel = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' rust-toolchain.toml)
          [ -n "$version" ] || { echo "::error::rust-toolchain.toml pins no x.y.z channel"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/ope-2298-html-frame

      - name: Build the harness
        run: cargo build --locked

      - name: Probe the local targets from the view sandboxed and framed in its window
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          mkdir -p ci-results && cd ci-results
          ${{ matrix.launcher }} cargo run --locked --quiet --manifest-path ../Cargo.toml -- probe-window-sandboxed

      - name: Probe the local targets from the view as a child webview in the thread
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          mkdir -p ci-results && cd ci-results
          ${{ matrix.launcher }} cargo run --locked --quiet --manifest-path ../Cargo.toml -- probe-in-thread

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}
          path: spikes/ope-2298-html-frame/ci-results/results-*.json
          if-no-files-found: error
