name: OPE-1452 windows tauri boot probe

on:
  push:
    branches:
      - feature/ope-1452-the-windows-job-of-the-release-workflow-builds-and-uploads

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.13", "1.4.4"]
    steps:
      - name: Runner environment
        shell: pwsh
        run: |
          $current = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          Write-Host "OPE1452|os-build=$($current.CurrentBuild).$($current.UBR)|image=$env:ImageVersion"
          Write-Host "OPE1452|node=$(node --version)|node-path=$((Get-Command node).Source)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Bun revision
        shell: bash
        run: echo "OPE1452|bun=$(bun --revision)|bun-path=$(command -v bun)"

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Tauri bin shims
        shell: bash
        working-directory: apps/app
        continue-on-error: true
        run: |
          ls -la node_modules/.bin | grep -i tauri
          od -c node_modules/.bin/tauri.bunx | head -8
          ls -la node_modules/@tauri-apps
          head -3 node_modules/@tauri-apps/cli/tauri.js

      - name: Probe each way of starting the tauri CLI
        timeout-minutes: 15
        shell: bash
        working-directory: apps/app
        run: |
          probe() {
            local name=$1; shift
            local started=$SECONDS
            local code=0
            timeout -k 5 120 "$@" > "$RUNNER_TEMP/$name.out" 2>&1 < /dev/null || code=$?
            echo "OPE1452|bun=${{ matrix.bun }}|probe=$name|exit=$code|seconds=$((SECONDS - started))"
            head -15 "$RUNNER_TEMP/$name.out"
          }
          probe node-direct node node_modules/@tauri-apps/cli/tauri.js --version
          probe bun-shim bun tauri --version
          probe bun-runtime bun --bun tauri --version
          probe bun-run-script bun run tauri:build --version

      - name: Probe the tauri-action spawn shape
        timeout-minutes: 25
        shell: bash
        working-directory: apps/app
        run: |
          cat > "$RUNNER_TEMP/spawn-probe.mjs" <<'PROBE'
          import { spawn, execFileSync } from "node:child_process";
          const [name, closeStdin, windowsHide, command, ...args] = process.argv.slice(2);
          const started = Date.now();
          const child = spawn(command, args, { stdio: "pipe", windowsHide: windowsHide === "hide", env: { ...process.env, FORCE_COLOR: "0" } });
          if (closeStdin === "close") child.stdin.end();
          let firstOutput = null;
          let head = "";
          const report = (outcome, code) => {
            console.log(`OPE1452|bun=${process.env.PROBE_BUN}|shape=${name}|outcome=${outcome}|exit=${code}|first-output-ms=${firstOutput ?? "none"}|ms=${Date.now() - started}`);
            console.log(head.split("\n").slice(0, 6).join("\n"));
          };
          const kill = () => { try { execFileSync("taskkill", ["/T", "/F", "/PID", String(child.pid)], { stdio: "ignore" }); } catch {} };
          const onData = (chunk) => {
            if (firstOutput === null) { firstOutput = Date.now() - started; setTimeout(() => { report("output", "killed"); kill(); }, 3000); }
            if (head.length < 2000) head += chunk.toString();
          };
          child.stdout.on("data", onData);
          child.stderr.on("data", onData);
          const hang = setTimeout(() => { report("hang", "killed"); kill(); }, 90000);
          child.on("exit", (code, signal) => { clearTimeout(hang); if (firstOutput === null) report("exit-before-output", code ?? signal); setTimeout(() => process.exit(0), 3500); });
          PROBE
          export PROBE_BUN=${{ matrix.bun }}
          for try in 1 2 3; do
            node "$RUNNER_TEMP/spawn-probe.mjs" "bun-build-open-hidden-$try" open hide bun tauri build
            node "$RUNNER_TEMP/spawn-probe.mjs" "bun-build-closed-hidden-$try" close hide bun tauri build
            node "$RUNNER_TEMP/spawn-probe.mjs" "bun-build-open-shown-$try" open show bun tauri build
            node "$RUNNER_TEMP/spawn-probe.mjs" "node-build-open-hidden-$try" open hide node node_modules/@tauri-apps/cli/tauri.js build
          done
