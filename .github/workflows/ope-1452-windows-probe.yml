name: OPE-1452 windows bun env probe

on:
  push:
    branches:
      - feature/ope-1452-the-windows-job-of-the-release-workflow-builds-and-uploads

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.13", "1.4.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Fetch the release bodies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.26.0-beta.1 --json body --jq .body > "$RUNNER_TEMP/beta1.txt"
          gh release view v0.25.0 --json body --jq .body > "$RUNNER_TEMP/v025.txt"
          for size in 4096 8192 12288 16000 16384 16500 24576 32000 32766 32768 65536; do
            head -c "$size" /dev/zero | tr '\0' 'a' > "$RUNNER_TEMP/flat-$size.txt"
          done
          wc -c "$RUNNER_TEMP"/*.txt

      - name: Start bun with each body as INPUT_RELEASEBODY
        timeout-minutes: 15
        shell: bash
        working-directory: apps/app
        run: |
          probe() {
            local body=$1; shift
            local name=$1; shift
            local code=0
            local started=$SECONDS
            INPUT_RELEASEBODY="$(cat "$RUNNER_TEMP/$body.txt")" timeout -k 5 60 "$@" > "$RUNNER_TEMP/out.txt" 2>&1 < /dev/null || code=$?
            echo "OPE1452|bun=${{ matrix.bun }}|body=$body|probe=$name|exit=$code|seconds=$((SECONDS - started))|$(head -c 160 "$RUNNER_TEMP/out.txt" | tr '\r\n' '  ')"
          }
          for body in v025 beta1 flat-4096 flat-8192 flat-12288 flat-16000 flat-16384 flat-16500 flat-24576 flat-32000 flat-32766 flat-32768 flat-65536; do
            probe "$body" bun-version bun --version
            probe "$body" bun-shim bun tauri --version
            probe "$body" bun-shim-again bun tauri --version
            probe "$body" node-direct node node_modules/@tauri-apps/cli/tauri.js --version
          done
