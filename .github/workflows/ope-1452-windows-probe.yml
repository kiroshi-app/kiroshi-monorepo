name: OPE-1452 windows release replay

on:
  push:
    branches:
      - feature/ope-1452-the-windows-job-of-the-release-workflow-builds-and-uploads

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: default
  RUSTC_WRAPPER: ""

jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        secrets: [release, signing-only]
        try: [1, 2]
    env:
      APPLE_CERTIFICATE: ${{ matrix.secrets == 'release' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ matrix.secrets == 'release' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ matrix.secrets == 'release' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ matrix.secrets == 'release' && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ matrix.secrets == 'release' && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.secrets == 'release' && secrets.APPLE_TEAM_ID || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri
          save-if: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar
        run: bun run --filter sidecar build

      - name: Start the process tree watchdog
        shell: pwsh
        run: |
          $watch = @'
          $log = Join-Path $env:RUNNER_TEMP 'tree.txt'
          while ($true) {
            $stamp = (Get-Date).ToUniversalTime().ToString('HH:mm:ss')
            $cpu = @{}
            Get-Process | ForEach-Object { $cpu[$_.Id] = [math]::Round($_.TotalProcessorTime.TotalSeconds, 1) }
            $rows = Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match '^(bun|node|cargo|rustc|tauri|makensis|esbuild|link|cl|cmd|conhost|werfault|kiroshi)' } |
              ForEach-Object {
                $line = if ($_.CommandLine) { $_.CommandLine.Substring(0, [math]::Min(150, $_.CommandLine.Length)) } else { '' }
                "  pid=$($_.ProcessId) ppid=$($_.ParentProcessId) cpu=$($cpu[[int]$_.ProcessId]) $($_.Name) $line"
              }
            Add-Content -LiteralPath $log -Value (@("== $stamp") + $rows)
            Start-Sleep -Seconds 60
          }
          '@
          $script = Join-Path $env:RUNNER_TEMP 'watch.ps1'
          Set-Content -LiteralPath $script -Value $watch
          Start-Process pwsh -ArgumentList '-NoProfile', '-File', $script -WindowStyle Hidden

      - name: Build
        timeout-minutes: 35
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/app

      - name: Process tree snapshots
        if: always()
        shell: bash
        run: |
          grep -c '^==' "$RUNNER_TEMP/tree.txt"
          awk '/^==/{n++} n<=3' "$RUNNER_TEMP/tree.txt"
          echo "..."
          tac "$RUNNER_TEMP/tree.txt" | awk '/^==/{n++; if (n==2) exit} {print}' | tac
