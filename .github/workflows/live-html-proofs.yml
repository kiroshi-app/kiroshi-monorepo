name: Live HTML proofs

on:
  pull_request:
    paths:
      - apps/app/src-tauri/src/live_html/**
      - apps/app/src-tauri/examples/live_html_proofs/**
      - apps/app/src-tauri/examples/live_html_behaviours/**
      - .github/workflows/live-html-proofs.yml

permissions:
  contents: read

concurrency:
  group: live-html-proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: ""
      LIVE_HTML_RUN_NAME: macos-ci
      LIVE_HTML_RESULTS: ${{ github.workspace }}/live-html/proofs.json
      LIVE_HTML_CAPTURES: ${{ github.workspace }}/live-html/captures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Rust version pinned in rust-toolchain.toml
        id: rust
        run: |
          version=$(sed -n 's/^channel = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' rust-toolchain.toml)
          [ -n "$version" ] || { echo "::error::rust-toolchain.toml pins no x.y.z channel"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri
          shared-key: live-html-proofs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the sidecar the Tauri build bundles
        run: bun run --filter sidecar build

      - name: Build the proofs and behaviours harnesses
        run: cargo build --locked --manifest-path apps/app/src-tauri/Cargo.toml --example live_html_proofs --example live_html_behaviours

      - name: Prepare the result directory
        run: mkdir -p "$LIVE_HTML_CAPTURES"

      - name: Play the seven proofs against the product mount
        timeout-minutes: 6
        run: apps/app/src-tauri/target/debug/examples/live_html_proofs

      - name: Capture the window after each command
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: apps/app/src-tauri/target/debug/examples/live_html_behaviours | tee live-html/behaviours.ndjson

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-html-proofs
          path: live-html
          if-no-files-found: warn
