name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: default

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# lint runs on every event but a push to main, without waiting on changes.
# scripts/ci-changes.ts selects every other job per event, verify requires every selected job.
# pull_request: changes, lint, vitest on the test files the diff changed, rust on its library tests, verify.
# merge_group: changes, lint, vitest, website, rust, storybook, verify.
# push to main: changes, ios, verify. The merge_group run of the commit already ran every desktop job.
# v* tag: changes, lint, vitest, website, rust, storybook, verify.
jobs:
  lint:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate
        run: bun scripts/ci.ts lint

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate
        run: bun scripts/ci.ts website

  vitest:
    needs: changes
    if: needs.changes.outputs.vitest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the changed test files against the base the merge ref was built on
        if: github.event_name == 'pull_request'
        run: git update-ref refs/remotes/origin/main HEAD^1

      - name: Gate on the test files the pull request changed
        if: github.event_name == 'pull_request'
        run: bun scripts/ci.ts changed

      - name: Gate
        if: github.event_name != 'pull_request'
        run: bun scripts/ci.ts vitest

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Drop the unused third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.*

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri
          shared-key: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate on the library tests and the integration targets, the bindings check left to the merge_group
        if: github.event_name == 'pull_request'
        run: bun scripts/ci.ts rust-pr

      - name: Gate
        if: github.event_name != 'pull_request'
        run: bun scripts/ci.ts rust

  storybook:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Drop the unused third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.*

      - name: Install Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      - name: Gate
        run: bun scripts/ci.ts storybook

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      CI_EVENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'tag' || github.event_name }}
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      vitest: ${{ steps.filter.outputs.vitest }}
      website: ${{ steps.filter.outputs.website }}
      storybook: ${{ steps.filter.outputs.storybook }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Fetch the base to diff against
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: git fetch --depth=1 origin "$BASE"

      - name: Decide the jobs to run
        id: filter
        run: bun scripts/ci-changes.ts "$CI_EVENT" "$BASE" | tee -a "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the Xcode pinned in .xcode-version
        run: sudo xcode-select --switch "/Applications/Xcode_$(cat .xcode-version).app"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Boot the simulator while the app builds
        run: |
          simulator=$(xcrun simctl list devices available "iOS $(cat .xcode-version)" | grep -m1 -E '^ +iPhone 17 \(' | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$simulator" > /dev/null 2>&1 &

      - name: Gate
        run: bun scripts/ci.ts ios

  verify:
    needs: [changes, lint, vitest, website, rust, storybook, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require changes to succeed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Require lint to succeed on every event but a push to main, and to be skipped on it
        if: needs.lint.result != ((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')) && 'success' || 'skipped')
        run: exit 1

      - name: Require vitest to succeed when changes selected it, and to be skipped otherwise
        if: needs.vitest.result != (needs.changes.outputs.vitest == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require website to succeed when changes selected it, and to be skipped otherwise
        if: needs.website.result != (needs.changes.outputs.website == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require rust to succeed when changes selected it, and to be skipped otherwise
        if: needs.rust.result != (needs.changes.outputs.rust == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require storybook to succeed when changes selected it, and to be skipped otherwise
        if: needs.storybook.result != (needs.changes.outputs.storybook == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require ios to succeed when changes selected it, and to be skipped otherwise
        if: needs.ios.result != (needs.changes.outputs.ios == 'true' && 'success' || 'skipped')
        run: exit 1
