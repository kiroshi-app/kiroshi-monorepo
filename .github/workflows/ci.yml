name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Baseline unit tests
        run: bun run test:baseline

      - name: Biome and knip against the baseline
        run: bun run baseline lint

      - name: Types
        run: bun run types

      - name: Regenerate the colour tokens
        run: bun run tokens:build

      - name: Colour CSS matches tokens.json
        run: git diff --exit-code packages/ui/src/styles/tokens.css

      - name: Colour asset catalogue matches tokens.json
        run: git add --intent-to-add apps/ios/Kiroshi/Colors.xcassets && git diff --exit-code apps/ios/Kiroshi/Colors.xcassets

      - name: iOS avatar bundle matches the avatar module
        run: bun run avatar:build && git diff --exit-code apps/ios/Kiroshi/Resources

      - name: Build website
        run: bun run --filter=website build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Drop the unused third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.*

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rustfmt
        working-directory: apps/app
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Build sidecar
        run: bun run --filter sidecar build

      - name: Clippy
        working-directory: apps/app
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features fake-claude -- -D warnings

      - name: Test
        working-directory: apps/app
        run: cargo test --manifest-path src-tauri/Cargo.toml --features fake-claude

      - name: Bindings match the command surface
        run: git diff --exit-code apps/app/src/lib/bindings.ts

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Drop the unused third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.*

      - name: Install Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      - name: Tests and stories against the baseline
        run: bun run baseline vitest

  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect iOS changes
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- apps/ios .swift-format .xcode-version .github/workflows/ci.yml; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the Xcode pinned in .xcode-version
        run: sudo xcode-select --switch "/Applications/Xcode_$(cat .xcode-version).app"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the derived data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/ios/build
          key: ios-derived-data-${{ hashFiles('.xcode-version') }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/**/Package.resolved', 'apps/ios/**/*.swift', 'apps/ios/*.xctestplan') }}
          restore-keys: ios-derived-data-${{ hashFiles('.xcode-version') }}-

      - name: Generate
        run: bun run ios:generate

      - name: Build for testing
        run: xcodebuild -project apps/ios/Kiroshi.xcodeproj -scheme Kiroshi -testPlan Kiroshi -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' -derivedDataPath apps/ios/build build-for-testing

      - name: Test on the simulator
        timeout-minutes: 25
        run: xcodebuild -project apps/ios/Kiroshi.xcodeproj -scheme Kiroshi -testPlan Kiroshi -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' -derivedDataPath apps/ios/build -parallel-testing-enabled NO test-without-building

      - name: Swift format
        run: swift format lint --recursive --strict apps/ios

  verify:
    needs: [changes, lint, rust, vitest, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require changes, lint, rust and vitest to succeed
        if: needs.changes.result != 'success' || needs.lint.result != 'success' || needs.rust.result != 'success' || needs.vitest.result != 'success'
        run: exit 1

      - name: Require ios to succeed when an iOS file changed, a skipped ios passes when none did
        if: needs.ios.result != (needs.changes.outputs.ios == 'true' && 'success' || 'skipped')
        run: exit 1
