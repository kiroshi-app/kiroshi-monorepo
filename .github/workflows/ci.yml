name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: default

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# lint runs on every event, without waiting on changes.
# scripts/ci-changes.ts selects every other job per event, verify requires every selected job.
# pull_request: changes, lint, vitest on the test files the diff changed, core on Linux, macOS and Windows, installer when apps/rune-preview changed, verify.
# push to main: changes, lint, vitest, website, core, installer on the paths changed since the last green push to main, ios split over three jobs, verify.
# v* tag: changes, lint, vitest, website, core, verify.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate
        run: bun scripts/ci.ts lint

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate
        run: bun scripts/ci.ts website

  vitest:
    needs: changes
    if: needs.changes.outputs.vitest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the changed test files against the base the merge ref was built on
        if: github.event_name == 'pull_request'
        run: git update-ref refs/remotes/origin/main HEAD^1

      - name: Gate on the test files the pull request changed
        if: github.event_name == 'pull_request'
        run: bun scripts/ci.ts changed

      - name: Gate
        if: github.event_name != 'pull_request'
        run: bun scripts/ci.ts vitest

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/rune-preview -> target
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the keyboard library the Rune app links on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libxkbcommon-dev

      - name: Gate
        shell: bash
        run: bun scripts/ci.ts core

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/rune-preview -> target
          shared-key: installer
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar
        run: bun run --filter sidecar build

      - name: Put NSIS on the path
        shell: bash
        run: |
          if [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis --no-progress --yes
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Build the NSIS installer
        shell: bash
        run: apps/rune-preview/scripts/package-windows.sh 0.0.0-ci "$RUNNER_TEMP/installer"

      - name: Install silently and launch the installed app once
        shell: pwsh
        run: apps/rune-preview/scripts/install-windows.ps1 -Installer "$env:RUNNER_TEMP\installer\Kiroshi_0.0.0-ci_x64-setup.exe" -LogDirectory "$env:RUNNER_TEMP\install-log"

      - name: Upload the install and launch log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-log

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      CI_EVENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'tag' || github.event_name }}
    outputs:
      vitest: ${{ steps.filter.outputs.vitest }}
      website: ${{ steps.filter.outputs.website }}
      ios: ${{ steps.filter.outputs.ios }}
      core: ${{ steps.filter.outputs.core }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Find the head of the last green push to main
        id: green
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch main --status success --limit 1 \
            --json headSha --jq '.[0].headSha // ""') || {
            echo "::warning::gh run list exited $? reading the last green push to main: every job runs"
            sha=""
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch the base to diff against
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --depth=1 origin "$BASE"

      - name: Decide the jobs to run
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.green.outputs.sha }}
        run: bun scripts/ci-changes.ts "$CI_EVENT" "$BASE" | tee -a "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      IOS_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the Xcode pinned in .xcode-version
        run: sudo xcode-select --switch "/Applications/Xcode_$(cat .xcode-version).app"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Boot the simulator while the app builds
        run: |
          simulator=$(xcrun simctl list devices available "iOS $(cat .xcode-version)" | grep -m1 -E '^ +iPhone 17 \(' | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$simulator" > /dev/null 2>&1 &

      - name: Gate
        timeout-minutes: 45
        run: bun scripts/ci.ts ios

  verify:
    needs: [changes, lint, vitest, website, core, installer, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require changes to succeed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Require lint to succeed
        if: needs.lint.result != 'success'
        run: exit 1

      - name: Require vitest to succeed when changes selected it, and to be skipped otherwise
        if: needs.vitest.result != (needs.changes.outputs.vitest == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require website to succeed when changes selected it, and to be skipped otherwise
        if: needs.website.result != (needs.changes.outputs.website == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require core to succeed on every OS when changes selected it, and to be skipped otherwise
        if: needs.core.result != (needs.changes.outputs.core == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require installer to succeed when changes selected it, and to be skipped otherwise
        if: needs.installer.result != (needs.changes.outputs.installer == 'true' && 'success' || 'skipped')
        run: exit 1

      - name: Require ios to succeed when changes selected it, and to be skipped otherwise
        if: needs.ios.result != (needs.changes.outputs.ios == 'true' && 'success' || 'skipped')
        run: exit 1
