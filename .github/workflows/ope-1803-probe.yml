name: OPE-1803 probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.pull_request.labels.*.name, 'ci:storybook')
    strategy:
      fail-fast: false
      matrix:
        variant: [stories-1, stories-2, stories-3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Drop the unused third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.*

      - name: Install Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      - name: Sample memory and processes every 5 s
        run: |
          node --version
          nohup bash -c 'while true; do echo "== $(date -u +%T)"; free -m | sed -n 2,3p; ps -eo pid,ppid,rss,etimes,args --sort=-rss | head -12 | cut -c1-220; ss -tan state established | wc -l; sleep 5; done' > "$RUNNER_TEMP/probe-memory.log" 2>&1 &

      - name: Run
        working-directory: packages/ui
        env:
          DEBUG: vitest:browser*,pw:browser*
        run: |
          set -o pipefail
          bunx vitest run --project=storybook 2>&1 | tee "$RUNNER_TEMP/probe-run.log"

      - name: Read the kernel log
        if: always()
        run: |
          sudo dmesg -T > "$RUNNER_TEMP/probe-dmesg.log" 2>&1 || true
          sudo journalctl -k --no-pager > "$RUNNER_TEMP/probe-journal-kernel.log" 2>&1 || true
          sudo journalctl --no-pager --since "-40 min" > "$RUNNER_TEMP/probe-journal.log" 2>&1 || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe-*.log
