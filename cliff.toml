[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [{ pattern = '(?m)[ \t]*\(#\d+\)$', replace = "" }]
commit_parsers = [
  { message = '^chore\(app\): release ', skip = true },
  { message = '^feat', group = "<!-- 00 -->Features" },
  { message = '^fix', group = "<!-- 01 -->Fixes" },
  { message = '^perf', group = "<!-- 02 -->Performance" },
  { message = '^refactor', group = "<!-- 03 -->Refactoring" },
  { message = '^revert', group = "<!-- 04 -->Reverts" },
  { message = '^docs', group = "<!-- 05 -->Documentation" },
  { message = '^test', group = "<!-- 06 -->Tests" },
  { message = '^style', group = "<!-- 07 -->Style" },
  { message = '^build', group = "<!-- 08 -->Build" },
  { message = '^ci', group = "<!-- 09 -->Continuous integration" },
  { message = '^chore', group = "<!-- 10 -->Chores" },
  { message = '.', group = "<!-- 11 -->Other" },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+'
ignore_tags = '-beta\.'
filter_commits = false
sort_commits = "oldest"
