[package]
name = "ope-2298-html-frame"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "=2.12.2", features = ["custom-protocol"] }
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
