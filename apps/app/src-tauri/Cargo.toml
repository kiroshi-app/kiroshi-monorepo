[package]
name = "kiroshi-app"
version = "0.24.2"
description = "Kiroshi desktop app"
edition = "2021"
license = "MIT"
repository = "https://github.com/shoto290/kiroshi-monorepo"
default-run = "Kiroshi"

[lib]
name = "kiroshi_app"
path = "src/lib.rs"

[[bin]]
name = "Kiroshi"
path = "src/main.rs"

# Every suite but real_claude.rs spawns this, so run them with
# `cargo test --features fake-claude`. Cargo hands the tests its path either
# way, so a plain `cargo test` still compiles and then fails at each spawn with
# `SpawnFailed { detail: "No such file or directory" }`.
#
# `fake_sidecar` stands in for the one process every session is served from, and
# for the install the connection probe and the model catalogue ask about.
[[bin]]
name = "fake_sidecar"
path = "src/bin/fake_sidecar.rs"
required-features = ["fake-claude"]

[features]
fake-claude = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
# Writes the one rotated log file of the install to the app log directory.
tauri-plugin-log = "2"
# The one route from the Rust command surface to the TypeScript the front reads: the
# Builder yields both the invoke handler and the exporter, so a command signature and its
# mirror can no longer drift. The Tauri v2 line is a pre-release, so all three are pinned.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "io-util", "net", "signal", "sync", "time", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Every bundle is its own repository and no machine is asked for a `git` binary:
# libgit2 is compiled in, and no transport is — nothing here ever leaves the disk.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# The one cron library that enumerates the occurrence before a given instant, which the
# catch-up of the occurrences missed while the app was closed reads.
croner = "4"
# Watches paths from the core rather than through `tauri-plugin-fs`, whose watch command only
# answers a window: a routine fires whether or not one listens. Shows `notify` through.
notify-debouncer-full = "0.7"
# Already in the tree under croner; named here so an instant in milliseconds becomes the wall
# clock a cron expression is read against, and the moment a payload carries.
chrono = "0.4"
# Answers the one local route a webhook routine is called on. Shows through hyper, which
# tauri already carries; only the HTTP/1 server is compiled in. `ws` relays the host events
# over a WebSocket, and brings tungstenite and sha1 in.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
# Reads what became of the pull request of a mission. Already in the tree under
# tauri-plugin-updater; named here with rustls so no system TLS stack is asked for.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Named only to hand reqwest the provider it asks for: already in the tree with ring compiled in,
# and no crate enters the lockfile through this line.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The one route to a fold that a search compares against: NFD splits an accented letter into
# its base and its marks, which are then dropped, so "Amelie" reaches "Amélie".
unicode-normalization = "0.1"
# Writes and reads the one archive a space travels in. Already in the tree under
# tauri-plugin-updater; named here so no crate enters the lockfile through this line.
tar = "0.4"
# Draws the nonce a Kiroshi account sign-in callback is matched on. Already in the tree under
# uuid; named here so no crate enters the lockfile through this line.
getrandom = "0.4"
# Holds the outbound relay socket a hosted space is reached through. Already in the tree under
# axum; named here with its client and rustls so no crate enters the lockfile through this line.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# Splits that socket into the stream it is read from and the sink it is written to. Already in
# the tree under axum and tokio-tungstenite; named here so no crate enters the lockfile through this line.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Carries the bytes of a relayed avatar inside its JSON frame. Already in the tree under axum;
# named here so no crate enters the lockfile through this line.
base64 = "0.22"
# Reads the version a release notes request names and orders the running version against the
# one a manifest offers. Already in the tree under tauri-plugin-updater; named here so no crate
# enters the lockfile through this line.
semver = "1"
# The facade every host line is written through. Already in the tree under tauri; named here
# so no crate enters the lockfile through this line.
log = "0.4"
# Scrubs every log line before it reaches the file. Already in the tree under tauri; named
# here so no crate enters the lockfile through this line.
regex = "1"
# The v2 relay protocol: device keys, frame and sealed-box encryption, subkey derivation and
# the fingerprint, all from RustCrypto and dalek so no libsodium is linked.
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
# Zeroes every copy of a device secret and a subkey on drop. Already in the tree under the dalek
# crates; named here so no crate enters the lockfile through this line.
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The route that answers what became of a notification when the executable runs outside a
# .app bundle, where `UNUserNotificationCenter` has no bundle identifier to work from.
# Already in the tree under `notify-rust`, which `tauri-plugin-notification` shows through.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
# The route a signed .app bundle shows through: `UNUserNotificationCenter` is the only one
# macOS reports a click back from once the app is installed. MIT OR Apache-2.0.
mac-usernotifications = "0.3"
# Already in the tree under `tao`; named here so the window controls are placed
# from their measured frames at runtime rather than from a literal in the config.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
	"std",
	"NSButton",
	"NSControl",
	"NSResponder",
	"NSView",
	"NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
	"std",
	"NSGeometry",
] }
# Keeps the device keys of an installed build in the login Keychain. Already in the tree under
# rustls-platform-verifier; named here so no crate enters the lockfile through this line.
security-framework = "3"

# Already in the tree under `tao` and `tauri`; named here so a child window can answer the
# hit-test Windows 11 opens Snap Layouts from over the front-rendered maximize button.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_System_LibraryLoader",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Already a dependency; named again so an integration test can build the pictures it
# uploads and decode the ones the host stored, rather than checking bytes in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "time", "rt-multi-thread", "test-util"] }
libc = "0.2"
# Already in the tree through tauri-specta; named so the member socket schema applies the
# same serde rewrites bindings.ts gets.
specta-serde = "=0.0.12"
