<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Live HTML behaviours</title>
		<style>
			body { margin: 0; background: #f4f4f4; }
			#placeholder { position: absolute; background: #00ffff; }
			#thread { position: fixed; inset: 0; overflow-y: auto; background: #f4f4f4; }
			#thread-content { position: relative; height: 20000px; }
			#slot { position: absolute; left: 40px; top: 440px; width: 480px; height: 160px; background: #00ffff; }
			#overlay { position: fixed; left: 40px; top: 400px; width: 480px; height: 100px; background: #0000ff; }
		</style>
	</head>
	<body>
		<div id="placeholder"></div>
		<div id="thread" hidden><div id="thread-content"><div id="slot"></div></div></div>
		<div id="overlay" hidden></div>
		<script>
			const { invoke, transformCallback } = window.__TAURI_INTERNALS__
			const ID = "prototype"
			const SHOWN = { x: 40, y: 80, width: 480, height: 300 }
			const MOVED = { x: 200, y: 160, width: 560, height: 340 }
			const CLIP = { x: 0, y: 260, width: 2000, height: 2000 }
			const placeholder = document.getElementById("placeholder")
			const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds))
			const paint = ({ x, y, width, height }) =>
				Object.assign(placeholder.style, { left: `${x}px`, top: `${y}px`, width: `${width}px`, height: `${height}px` })
			const answer = (call) => call.then(() => "ok", (failure) => failure)
			const capture = async (step, rectangle, clip, note) => {
				await pause(600)
				return invoke("capture_step", { step, rectangle, clip, note: note ?? null })
			}

			const play = async () => {
				const html = await (await fetch("/prototype.html")).text()
				paint(SHOWN)
				await capture("placeholder", SHOWN, null)
				await invoke("live_html_mount", { id: ID, html, rectangle: SHOWN })
				await pause(2500)
				await capture("show", SHOWN, null)
				const twice = await answer(invoke("live_html_mount", { id: ID, html, rectangle: SHOWN }))
				const unknown = await answer(invoke("live_html_place", { id: "missing", rectangle: SHOWN, clip: null }))
				paint(MOVED)
				await invoke("live_html_place", { id: ID, rectangle: MOVED, clip: null })
				await capture("move", MOVED, null, { mountTwice: twice, placeUnknown: unknown })
				await invoke("live_html_place", { id: ID, rectangle: MOVED, clip: CLIP })
				await capture("clip", MOVED, CLIP)
				await invoke("live_html_hide", { id: ID })
				await capture("hide", MOVED, CLIP)
				await invoke("live_html_show", { id: ID })
				await capture("show-again", MOVED, CLIP)
				await invoke("resize_window", { width: 1100, height: 760 })
				await capture("resize", MOVED, CLIP)
				await invoke("live_html_remove", { id: ID })
				await capture("remove", MOVED, CLIP)
				await invoke("live_html_mount", { id: "before-reload", html, rectangle: SHOWN })
				await pause(1500)
				await capture("before-reload", SHOWN, null)
				sessionStorage.setItem("reloaded", "yes")
				location.reload()
			}

			const MEASURED_EVENT = "live-html://measured"
			const PAGE = (body, onload = "") =>
				`<!doctype html><html><body style="margin:0" onload="${onload}">${body}</body></html>`
			const GROWS = `<div id="grows" style="height:100px;background:#ff00ff"></div>`
			const growTo = (height, after) =>
				`setTimeout(() => { document.getElementById('grows').style.height = '${height}px' }, ${after});`
			const SHORT_PAGE = PAGE(`<div style="height:120px;background:#ff00ff"></div>`)
			const LONG_PAGE = PAGE(`<div style="height:3000px;background:#ff00ff"></div>`)
			const GROWING_PAGE = PAGE(GROWS, growTo(400, 600) + growTo(200, 1200))
			const LATE_PAGE = PAGE(GROWS, growTo(500, 1500))
			const WIDE_PAGE = PAGE(
				`<div style="display:flex;width:1440px;height:360px">
					<div style="flex:1;background:#ff00ff"></div><div style="flex:1;background:#00ffff"></div>
				</div>`,
				"setInterval(() => scrollTo(9999, 9999), 50)",
			)
			const FLOOD_PAGE = PAGE(
				"",
				"const ipc = window.webkit.messageHandlers.ipc; for (let batch = 0; batch < 10; batch++) setTimeout(() => { for (let posted = 0; posted < 1000; posted++) ipc.postMessage(JSON.stringify([480, 200 + batch * 1000 + posted])) }, batch * 100)",
			)
			const FLOODED_LAST_HEIGHT = 200 + 9999
			const VIEWPORT_PAGE = `<!doctype html><html><head><style>body { min-height: 100vh; background: #ff00ff }</style></head><body></body></html>`
			const TOP_STRIPE = `<div style="height:100px;background:#00ffff"></div><div style="height:2900px;background:#ff00ff"></div>`
			const SCROLLED_PAGE = PAGE(TOP_STRIPE, "setInterval(() => scrollTo(0, 500), 50)")
			const SCROLLING_BODY_PAGE = PAGE(
				`<style>body { overflow: scroll !important; height: 100vh }</style>${TOP_STRIPE}`,
				"setInterval(() => { document.body.scrollTop = 500 }, 50)",
			)
			const NOWHERE = { x: 0, y: 0, width: 0, height: 0 }
			const TOLERANCE = 3
			const measurements = []
			const followed = new Set()
			const follow = ({ id, width, height }) =>
				invoke("live_html_place", { id, rectangle: { ...SHOWN, width, height }, clip: null }).catch((failure) =>
					invoke("finish_run", { failure: `placing ${id} failed: ${JSON.stringify(failure)}` }),
				)
			const measuredFor = (id) => measurements.filter((payload) => payload.id === id)
			const fail = (reason) => {
				throw reason
			}
			const expect = (isMet, reason) => isMet || fail(reason)
			const near = (length, expected) => Math.abs(length - expected) <= TOLERANCE
			const until = async (isMet, reason) => {
				for (let waited = 0; waited < 8000; waited += 50) {
					if (isMet()) return
					await pause(50)
				}
				fail(typeof reason === "function" ? reason() : reason)
			}
			const sizesOf = (id) => JSON.stringify(measuredFor(id).map(({ width, height }) => [width, height]))
			const expectSizes = async (id, sizes) => {
				const expected = JSON.stringify(sizes)
				await until(
					() => sizesOf(id) === expected,
					() => `${id} measured ${sizesOf(id)}, expected ${expected}`,
				)
			}
			const expectSizesHeld = async (id, sizes) => {
				await expectSizes(id, sizes)
				await pause(1000)
				expect(sizesOf(id) === JSON.stringify(sizes), `${id} measured ${sizesOf(id)} once settled`)
			}

			const expectUnscrolled = async (id, html) => {
				await invoke("live_html_mount", { id, html, rectangle: SHOWN })
				await until(() => measuredFor(id).length > 0, `${id} was never measured`)
				const { magenta_drawn_in_window_points: rest, cyan_drawn_in_window_points: top } = await capture(id, SHOWN, null)
				const drawn = JSON.stringify({ top, rest })
				expect(top && rest, `${id} drew ${drawn}`)
				expect(near(top.y, SHOWN.y) && near(top.height, 100), `${id} scrolled: ${drawn}`)
				expect(near(rest.y, SHOWN.y + 100) && near(rest.height, SHOWN.height - 100), `${id} scrolled: ${drawn}`)
				await invoke("live_html_remove", { id })
			}

			const measure = async () => {
				await invoke("plugin:event|listen", {
					event: MEASURED_EVENT,
					target: { kind: "Any" },
					handler: transformCallback(({ payload }) => {
						measurements.push(payload)
						if (followed.has(payload.id)) follow(payload)
					}),
				})
				paint(NOWHERE)

				await invoke("live_html_mount", { id: "short", html: SHORT_PAGE, rectangle: SHOWN })
				await expectSizes("short", [[SHOWN.width, 120]])
				const fields = Object.keys(measuredFor("short")[0]).sort().join(",")
				expect(fields === "height,id,width", `the measured payload carries ${fields}`)
				await invoke("live_html_place", { id: "short", rectangle: { ...SHOWN, height: 120 }, clip: null })
				await expectSizesHeld("short", [[SHOWN.width, 120]])
				await invoke("live_html_remove", { id: "short" })

				await invoke("live_html_mount", { id: "long", html: LONG_PAGE, rectangle: SHOWN })
				await expectSizesHeld("long", [[SHOWN.width, 3000]])
				await invoke("live_html_remove", { id: "long" })

				await invoke("live_html_mount", { id: "growing", html: GROWING_PAGE, rectangle: SHOWN })
				await expectSizesHeld("growing", [[SHOWN.width, 100], [SHOWN.width, 400], [SHOWN.width, 200]])
				await invoke("live_html_remove", { id: "growing" })

				await invoke("live_html_mount", { id: "removed", html: LATE_PAGE, rectangle: SHOWN })
				await expectSizes("removed", [[SHOWN.width, 100]])
				await invoke("live_html_remove", { id: "removed" })
				await pause(2500)
				expect(sizesOf("removed") === JSON.stringify([[SHOWN.width, 100]]), `removed measured ${sizesOf("removed")}`)

				await invoke("live_html_mount", { id: "wide", html: WIDE_PAGE, rectangle: SHOWN })
				await expectSizes("wide", [[SHOWN.width, 360]])
				const unfitted = { ...SHOWN, height: 360 }
				await invoke("live_html_place", { id: "wide", rectangle: unfitted, clip: null })
				const { magenta_drawn_in_window_points: left, cyan_drawn_in_window_points: right } = await capture(
					"wide-clipped",
					unfitted,
					null,
				)
				const halves = JSON.stringify({ left, right })
				expect(left && !right, `the wide page drew ${halves}`)
				expect(near(left.x, SHOWN.x) && near(left.width, SHOWN.width), `the wide left half is ${halves}`)
				expect(near(left.height, 360), `the wide left half is ${halves}`)
				expect(sizesOf("wide") === JSON.stringify([[SHOWN.width, 360]]), `wide measured ${sizesOf("wide")}`)
				await invoke("live_html_remove", { id: "wide" })

				await invoke("live_html_mount", { id: "flood", html: FLOOD_PAGE, rectangle: SHOWN })
				const lastFlooded = () => measuredFor("flood").at(-1)?.height
				await until(
					() => lastFlooded() === FLOODED_LAST_HEIGHT,
					() => `flood last measured ${lastFlooded()}`,
				)
				await pause(500)
				const flooded = measuredFor("flood").length
				expect(flooded <= 11 && lastFlooded() === FLOODED_LAST_HEIGHT, `flood emitted ${flooded}, last ${lastFlooded()}`)
				await invoke("live_html_remove", { id: "flood" })

				followed.add("viewport")
				await invoke("live_html_mount", { id: "viewport", html: VIEWPORT_PAGE, rectangle: SHOWN })
				await until(() => measuredFor("viewport").length > 0, "viewport was never measured")
				await pause(2000)
				const settled = sizesOf("viewport")
				const lastViewport = measuredFor("viewport").at(-1).height
				expect(measuredFor("viewport").length <= 3, `viewport measured ${settled}`)
				expect(lastViewport < SHOWN.height + 100, `viewport measured ${settled}`)
				await invoke("live_html_remove", { id: "viewport" })

				await expectUnscrolled("scrolled", SCROLLED_PAGE)
				await expectUnscrolled("scrolling-body", SCROLLING_BODY_PAGE)
			}

			const BARE_PAGE = `<div style="height:120px"></div>`
			const OWN_PAGE = `<!doctype html><html><head><style>body { background: #ff00ff }</style></head><body><div style="height:120px"></div></body></html>`
			const HTML_ONLY_PAGE = `<!doctype html><html><head><style>html { background: #ff00ff }</style></head><body><div style="height:120px"></div></body></html>`
			const DARK = { appearance: "dark", hue: null }
			const LIGHT = { appearance: "light", hue: 257 }
			const DARK_BACKGROUND = [0, 0, 0]
			const LIGHT_BACKGROUND = [245, 245, 245]
			const SHADE_TOLERANCE = 8
			const isShade = (color, expected) => expected.every((channel, index) => Math.abs(color[index] - channel) <= SHADE_TOLERANCE)
			const expectBackground = async (step, expected) => {
				await pause(600)
				const [color] = await invoke("probe_colors", { step, probes: [[SHOWN.x + SHOWN.width / 2, SHOWN.y + 60]] })
				expect(isShade(color, expected), `${step}: the page background is ${JSON.stringify(color)}, expected ${JSON.stringify(expected)}`)
			}

			const expectOwnBackground = async (id, html, view) => {
				await invoke("live_html_mount", { id, html, rectangle: SHOWN, theme: DARK })
				await expectSizes(id, [[SHOWN.width, 120]])
				const { magenta_drawn_in_window_points: own } = await capture(`${id}-background`, view, null)
				const isAcrossTheView =
					own && near(own.x, view.x) && near(own.y, view.y) && near(own.width, view.width) && near(own.height, view.height)
				expect(isAcrossTheView, `${id} drew its own background on ${JSON.stringify(own)}, not across ${JSON.stringify(view)}`)
				await invoke("live_html_remove", { id })
			}

			const theme = async () => {
				paint(NOWHERE)
				await invoke("live_html_mount", { id: "themed", html: BARE_PAGE, rectangle: SHOWN, theme: DARK })
				await expectSizes("themed", [[SHOWN.width, 120]])
				await expectBackground("themed-dark", DARK_BACKGROUND)
				const { content_loads: loadsBefore } = await capture("themed-before", SHOWN, null)
				await invoke("live_html_theme", { id: "themed", theme: LIGHT })
				await expectBackground("themed-light", LIGHT_BACKGROUND)
				const { content_loads: loadsAfter } = await capture("themed-after", SHOWN, null)
				expect(loadsAfter === loadsBefore, `the page loaded ${loadsAfter - loadsBefore} more times to change its theme`)
				const unknown = await answer(invoke("live_html_theme", { id: "missing", theme: LIGHT }))
				expect(unknown.kind === "unknownView", `theming an unknown view answered ${JSON.stringify(unknown)}`)
				await invoke("live_html_remove", { id: "themed" })

				followed.add("own")
				await expectOwnBackground("own", OWN_PAGE, { ...SHOWN, height: 120 })
				await expectOwnBackground("html-only", HTML_ONLY_PAGE, SHOWN)
			}

			const SLOT_PAGE = PAGE(`<div style="height:160px;background:#ff00ff"></div>`)
			const COMPOSED = "composed"
			const RADIUS = 24
			const CORNERS = { topLeft: 0, topRight: 0, bottomRight: RADIUS, bottomLeft: RADIUS }
			const INSIDE = 2
			const rectOf = (element) => {
				const { x, y, width, height } = element.getBoundingClientRect()
				return { x, y, width, height }
			}
			const placeOnSlot = (id, slot) => {
				let wanted = null
				let isPlacing = false
				const settle = async () => {
					if (isPlacing) return
					isPlacing = true
					while (wanted) {
						const rectangle = wanted
						wanted = null
						await invoke("live_html_place", { id, rectangle, clip: null })
					}
					isPlacing = false
				}
				const update = () => {
					wanted = rectOf(slot)
					void settle()
				}
				document.addEventListener("scroll", update, { capture: true, passive: true })
				update()
				return () => document.removeEventListener("scroll", update, { capture: true })
			}
			const isMagenta = ([r, g, b]) => r > 220 && g < 70 && b > 230
			const extentOf = (...boxes) => {
				const drawn = boxes.filter(Boolean)
				return Math.max(...drawn.map(({ y, height }) => y + height)) - Math.min(...drawn.map(({ y }) => y))
			}
			const expectOnItsSlot = ({ magenta, cyan }, slot, what) => {
				const drawn = JSON.stringify({ magenta, cyan, slot })
				expect(magenta, `${what}: nothing of the page was drawn in its slot ${drawn}`)
				const drift = extentOf(magenta, cyan) - slot.height
				expect(near(drift, 0), `${what}: the view and its slot drew ${drift} points apart ${drawn}`)
			}
			const expectAbove = ({ blue, magenta }, overlay, what) => {
				const drawn = JSON.stringify({ blue, magenta, overlay })
				expect(blue && near(blue.y, overlay.y) && near(blue.height, overlay.height), `${what}: the view drew over the overlay ${drawn}`)
				expect(magenta, `${what}: the page vanished around the overlay ${drawn}`)
			}
			const swipe = async (step, gesture, capturesAt, pointer) => {
				const { captures } = await invoke("swipe_while_capturing", {
					swipe: { step, pointer, gesture, intervalMs: 16, capturesAt },
				})
				for (const shot of captures) {
					expect(shot.holders_standing_aside.every(Boolean), `${step} event ${shot.event}: the live view kept drawing itself`)
				}
				return captures
			}
			const insideCornersOf = ({ x, y, width, height }) => [
				[x + INSIDE, y + INSIDE],
				[x + width - INSIDE, y + INSIDE],
				[x + width - INSIDE, y + height - INSIDE],
				[x + INSIDE, y + height - INSIDE],
			]
			const expectCut = (colors, what) => {
				const [topLeft, topRight, bottomRight, bottomLeft] = colors ?? []
				const isCut = colors && isMagenta(topLeft) && isMagenta(topRight) && !isMagenta(bottomRight) && !isMagenta(bottomLeft)
				expect(isCut, `${what}: the corners were not cut to ${JSON.stringify(CORNERS)}: ${JSON.stringify(colors)}`)
			}
			const expectCutAt = async (step, rectangle, what) => {
				await pause(600)
				const bottomEdge = [rectangle.x + rectangle.width / 2, rectangle.y + rectangle.height - INSIDE]
				const [edge, ...corners] = await invoke("probe_colors", { step, probes: [bottomEdge, ...insideCornersOf(rectangle)] })
				expectCut(corners, what)
				expect(isMagenta(edge), `${what}: the bottom edge between its cut corners was not drawn: ${JSON.stringify(edge)}`)
			}
			const holderOf = (reading) =>
				reading.measured.content_view.children.find(({ class: name }) => name === "KiroshiLiveHtmlHolder")

			const compose = async () => {
				const thread = document.getElementById("thread")
				const slot = document.getElementById("slot")
				const overlay = document.getElementById("overlay")
				thread.hidden = false
				const { y: slotTop, height: slotHeight } = rectOf(slot)
				expect(slotTop + slotHeight <= innerHeight, `the slot ends at ${slotTop + slotHeight}, below the ${innerHeight} point window`)
				await invoke("live_html_mount", { id: COMPOSED, html: SLOT_PAGE, rectangle: rectOf(slot) })
				const stopPlacing = placeOnSlot(COMPOSED, slot)
				await pause(1500)

				await invoke("live_html_round", { id: COMPOSED, corners: CORNERS })
				const at = rectOf(slot)
				await expectCutAt("rounded", at, "the live view")
				const invalidRadius = await answer(invoke("live_html_round", { id: COMPOSED, corners: { ...CORNERS, topLeft: -1 } }))
				expect(invalidRadius.kind === "invalidRadius", `a negative radius answered ${JSON.stringify(invalidRadius)}`)
				await expectCutAt("rounded-after-refusal", at, "the live view after a refused radius")

				slot.style.height = `${at.height - 40}px`
				await invoke("live_html_place", { id: COMPOSED, rectangle: rectOf(slot), clip: null })
				await expectCutAt("rounded-shorter", rectOf(slot), "the live view made shorter")
				slot.style.height = `${at.height}px`
				await invoke("live_html_place", { id: COMPOSED, rectangle: at, clip: null })
				await expectCutAt("rounded-restored", at, "the live view back at its height")

				const still = await invoke("live_html_still", { id: COMPOSED })
				expect(still.startsWith("data:image/png;base64,"), `the still reads ${still.slice(0, 40)}`)
				Object.assign(slot.style, {
					background: `url(${still}) 0 0 / 100% 100%`,
					borderRadius: `${CORNERS.topLeft}px ${CORNERS.topRight}px ${CORNERS.bottomRight}px ${CORNERS.bottomLeft}px`,
				})
				await invoke("live_html_hide", { id: COMPOSED })
				await expectCutAt("rounded-still", at, "the still")
				await invoke("live_html_show", { id: COMPOSED })

				const beside = [at.x + at.width + 100, at.y + 50]
				const swiped = [
					...(await swipe("trackpad", { device: "trackpad", delta: -8, moves: 30 }, [3, 8, 13, 18], beside)),
					...(await swipe("wheel", { device: "mouseWheel", delta: 1, moves: 4 }, [1, 2], beside)),
				]
				for (const shot of swiped) expectOnItsSlot(shot, at, `swipe event ${shot.event}`)
				expectCut(swiped[0].magenta_corners, `the still mid swipe, event ${swiped[0].event}`)
				const settled = await capture("after-swipes", rectOf(slot), null)
				expectOnItsSlot({ magenta: settled.magenta_drawn_in_window_points, cyan: settled.cyan_drawn_in_window_points }, at, "after the swipes")
				const holder = holderOf(settled)
				expect(!holder.hidden && holder.alpha === 1, `the live view did not come back after the swipes ${JSON.stringify(holder)}`)
				await expectCutAt("rounded-after-swipes", rectOf(slot), "the live view back from behind its still")

				const readings = []
				for (let frame = 0; frame < 20; frame++) {
					thread.scrollTop += 6
					await pause(16)
					readings.push((await invoke("standing_aside")).every(Boolean))
				}
				const firstAside = readings.indexOf(true)
				expect(
					firstAside >= 0 && readings.slice(firstAside).every(Boolean),
					`a scroll with no wheel left the live view drawn: ${JSON.stringify(readings)}`,
				)
				await pause(600)
				const rested = await invoke("standing_aside")
				expect(rested.every((isAside) => !isAside), `the live view did not come back after a scroll with no wheel ${JSON.stringify(rested)}`)

				overlay.hidden = false
				overlay.style.top = `${rectOf(slot).y - 40}px`
				await invoke("live_html_hide", { id: COMPOSED })
				const covered = rectOf(overlay)
				const shown = await capture("overlay", rectOf(slot), null)
				expectAbove({ blue: shown.blue_drawn_in_window_points, magenta: shown.magenta_drawn_in_window_points }, covered, "overlay")
				await swipe("overlay-swipe", { device: "trackpad", delta: -1, moves: 4 }, [], beside)
				const stayed = await capture("overlay-after-swipe", rectOf(slot), null)
				expectAbove({ blue: stayed.blue_drawn_in_window_points, magenta: stayed.magenta_drawn_in_window_points }, covered, "overlay after a swipe")
				overlay.hidden = true
				await invoke("live_html_show", { id: COMPOSED })

				stopPlacing()
				await invoke("live_html_remove", { id: COMPOSED })
				thread.hidden = true
			}

			const afterReload = async () => {
				paint(SHOWN)
				await pause(1000)
				await capture("after-reload", SHOWN, null)
				await measure()
				await theme()
				await compose()
				await invoke("finish_run")
			}

			;(sessionStorage.getItem("reloaded") ? afterReload() : play()).catch((failure) =>
				invoke("finish_run", { failure: JSON.stringify(failure) }),
			)
		</script>
	</body>
</html>
