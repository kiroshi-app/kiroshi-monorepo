<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#09090b"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://kiroshi.app/" />
    <title>Kiroshi: Your team of agents.</title>
    <meta
      name="description"
      content="Your team of agents. They live on your machine, work in your tools, and keep going while you do something else."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kiroshi" />
    <meta property="og:title" content="Kiroshi: Your team of agents." />
    <meta
      property="og:description"
      content="Your team of agents. They live on your machine, work in your tools, and keep going while you do something else."
    />
    <meta property="og:url" content="https://kiroshi.app/" />
    <meta property="og:image" content="https://kiroshi.app/share-wide.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kiroshi: your team of agents." />
    <meta property="og:image" content="https://kiroshi.app/share-square.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Kiroshi: your team of agents." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kiroshi: Your team of agents." />
    <meta
      name="twitter:description"
      content="Your team of agents. They live on your machine, work in your tools, and keep going while you do something else."
    />
    <meta name="twitter:image" content="https://kiroshi.app/share-wide.jpg" />
    <meta name="twitter:image:alt" content="Kiroshi: your team of agents." />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      (() => {
        const root = document.documentElement
        const darkQuery = window.matchMedia("(prefers-color-scheme: dark)")
        const applyScheme = () =>
          root.classList.toggle("dark", darkQuery.matches)
        const suppressTransitions = () => {
          const style = document.createElement("style")
          style.appendChild(
            document.createTextNode(
              "*,*::before,*::after{-webkit-transition:none!important;transition:none!important}",
            ),
          )
          document.head.appendChild(style)

          return () => {
            window.getComputedStyle(document.body)
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                style.remove()
              })
            })
          }
        }
        const flipScheme = () => {
          const restoreTransitions = suppressTransitions()
          applyScheme()
          restoreTransitions()
        }

        applyScheme()
        darkQuery.addEventListener("change", flipScheme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
