[package]
name = "kiroshi-rune-preview"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
fake-claude = []

[[bin]]
name = "fake_sidecar"
path = "../../app/src-tauri/src/bin/fake_sidecar.rs"
required-features = ["fake-claude"]
test = false

[[test]]
name = "local_core"
required-features = ["fake-claude"]

[dependencies]
base64 = "0.22"
chrono = "0.4"
kiroshi-rune-kit = { path = "../kit" }
kiroshi-rune-os = { path = "../os" }
rune.workspace = true
rune-kit.workspace = true
kiroshi-core = { path = "../../../crates/kiroshi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = "2"
uuid = { version = "1", features = ["v4"] }
yrs = "0.28"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
