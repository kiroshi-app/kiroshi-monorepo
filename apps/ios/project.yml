name: Kiroshi
options:
  deploymentTarget:
    iOS: "27.0"
  # Build number: Xcode Cloud's CI_BUILD_NUMBER when set, else the commit count of HEAD, written to BuildNumber.xcconfig on every generate.
  preGenCommand: echo "CURRENT_PROJECT_VERSION = ${CI_BUILD_NUMBER:-$(git rev-list --count HEAD)}" > BuildNumber.xcconfig
  # Xcode Cloud resolves no package on its own: the pinned Package.resolved goes into the generated project.
  # The packages check out under build/, which swift format lint must skip.
  postGenCommand: >-
    mkdir -p Kiroshi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm build &&
    cp Package.resolved Kiroshi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved &&
    echo '*' > build/.swift-format-ignore
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 7.1.0
targets:
  Kiroshi:
    type: application
    platform: iOS
    sources:
      - path: Kiroshi
        excludes: [Resources]
      - path: Kiroshi/Resources/companion-avatar.js
        buildPhase: resources
      - path: Kiroshi/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Kiroshi/Resources/bip39-english.txt
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Kiroshi/Info.plist
      properties:
        UILaunchScreen:
          UIImageName: Hexagon
          UIColorName: background
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID).apps.googleusercontent.com
        GIDServerClientID: 831614415289-j73b47kr5ln51a378i3l6ihg50v63kne.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.$(GOOGLE_IOS_CLIENT_ID)
    entitlements:
      path: Kiroshi/Kiroshi.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    configFiles:
      Debug: BuildNumber.xcconfig
      Release: BuildNumber.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiroshi.app.ios
        # The iOS OAuth client of Google Cloud, without its .apps.googleusercontent.com suffix.
        GOOGLE_IOS_CLIENT_ID: 831614415289-59cv7mehlnle13diuuelb5ngboftdv3l
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BBE5V2JL5H
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Kiroshi
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: primary
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [KiroshiTests, KiroshiUITests]
      testPlans:
        - path: Kiroshi.xctestplan
          defaultPlan: true
        - path: KiroshiUnit.xctestplan
  KiroshiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KiroshiTests]
    dependencies:
      - target: Kiroshi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiroshi.app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  KiroshiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KiroshiUITests]
    dependencies:
      - target: Kiroshi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiroshi.app.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kiroshi
