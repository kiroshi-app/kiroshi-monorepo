name: Kiroshi
options:
  deploymentTarget:
    iOS: "27.0"
  # Build number: Xcode Cloud's CI_BUILD_NUMBER when set, else the commit count of HEAD, written to BuildNumber.xcconfig on every generate.
  preGenCommand: echo "CURRENT_PROJECT_VERSION = ${CI_BUILD_NUMBER:-$(git rev-list --count HEAD)}" > BuildNumber.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Kiroshi:
    type: application
    platform: iOS
    sources:
      - path: Kiroshi
        excludes: [Resources]
      - path: Kiroshi/Resources/companion-avatar.js
        buildPhase: resources
    info:
      path: Kiroshi/Info.plist
      properties:
        UILaunchScreen:
          UIImageName: Hexagon
          UIColorName: background
    configFiles:
      Debug: BuildNumber.xcconfig
      Release: BuildNumber.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiroshi.app.ios
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kiroshi
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: primary
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [KiroshiTests, KiroshiUITests]
  KiroshiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KiroshiTests]
    dependencies:
      - target: Kiroshi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiroshi.app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  KiroshiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KiroshiUITests]
    dependencies:
      - target: Kiroshi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiroshi.app.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kiroshi
